# TEMPORAL: solo corre en la rama de trabajo para ver cómo vienen las páginas. Se borra antes de mergear.
name: Diagnóstico (temporal)

on:
  push:
    branches: [claude/inspiring-lovelace-w52u9k]
    paths: ['scripts/**', '.github/workflows/diagnostico.yml']

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3 playwright==1.48.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/diagnostico.py
